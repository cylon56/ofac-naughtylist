name: Update the naughtylist

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      # Push the refreshed data back to the default branch.
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the token in .git/config while the pipeline runs.
          # The push step below supplies it only to git push.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update pipeline
        run: python -m src.main

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet data/ README.md && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Naughtylist Bot"
          git config user.email "naughtylist-bot@users.noreply.github.com"
          git add data/ README.md
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          ADDR_COUNT=$(python -c "import json; print(json.load(open('data/metadata.json'))['total_addresses'])")
          git commit -m "naughtylist updated — ${TIMESTAMP} — ${ADDR_COUNT} addresses checked twice"
          # Same auth header that actions/checkout persists by default, but
          # given to this one git command through its environment only.
          BASIC=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::${BASIC}"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${BASIC}" \
            git push
